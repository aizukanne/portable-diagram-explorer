<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="78" fill="#0f172a"/>
<text x="40" y="51" font-size="32" font-weight="700" fill="#ffffff">Data platform — shared services</text>
<line x1="500.0" y1="300.0" x2="620.0" y2="300.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="300.0" x2="1120.0" y2="300.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="120" y="200" width="380" height="200" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="310" y="294" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">PostgreSQL cluster</text>
<text x="310" y="330" text-anchor="middle" font-size="21" fill="#334155">primary + 2 replicas</text></g>
<g><rect x="620" y="200" width="380" height="200" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="810" y="294" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Object store</text>
<text x="810" y="330" text-anchor="middle" font-size="21" fill="#334155">documents, exports</text></g>
<g><rect x="1120" y="200" width="380" height="200" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="1310" y="294" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Event stream</text>
<text x="1310" y="330" text-anchor="middle" font-size="21" fill="#334155">account and billing events</text></g>
</svg>